name: Publish Expositor Manta Alpha Installer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-expositor-release.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified native installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/expositor-installer"
          gh run download 40958474352 --repo "$GITHUB_REPOSITORY" --name TheExpositor-snplg --dir "$RUNNER_TEMP/expositor-installer"
          test -s "$RUNNER_TEMP/expositor-installer/the-expositor.snplg"
          cp "$RUNNER_TEMP/expositor-installer/the-expositor.snplg" "$RUNNER_TEMP/Expositor-Manta-3.31.45-v1.0.0-alpha.snplg"
          sha256sum "$RUNNER_TEMP/Expositor-Manta-3.31.45-v1.0.0-alpha.snplg"
      - name: Publish clearly labeled Manta test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$RUNNER_TEMP/Expositor-Manta-3.31.45-v1.0.0-alpha.snplg"
          TAG="v1.0.0-alpha"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --prerelease --title "The Expositor v1.0 alpha — Supernote Manta" --notes "Compiled with Supernote's React Native 0.79.2 plugin framework for Chauvet 3.31.45. Source model and privacy tests pass; native .npk, JS bundle, and AsyncStorage registration verified. v1.0 adds user-approved native NOTE insertion: study prompts, source cards, and mentor questions insert as a short text box on a verified blank Note page for handwriting beneath. It requires FILE:WRITE permission, checks page blankness twice, and refuses PDF/EPUB/occupied pages. Matching 16-page handwriting template PDF is available separately. Prior handwriting OCR, private export protections and storage recovery remain. Handwriting OCR, PDF text selection, the Preaching Mentor Desk, and public/private source controls remain included. The source-informed Preaching Mentor Desk remains included. PHYSICAL MANTA TESTING IS STILL REQUIRED. Use disposable notes first. Metadata is stored locally without encryption; do not enter confidential pastoral counseling details. Copy the .snplg to MyStyle, then install via Settings > Apps > Plugins."
          fi
