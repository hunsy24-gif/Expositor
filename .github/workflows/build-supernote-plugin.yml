name: Build Expositor Supernote Plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install required Android platforms
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Validate research logic and source integrity
        run: |
          node tests/domain.test.mjs
          node tests/integrity.mjs
          node tests/mentor.test.mjs
          node tests/ink.test.mjs
          node tests/storage.test.mjs
          node tests/audit.test.mjs
          node tests/note-bridge.test.mjs
      - name: Compile native Supernote installer
        run: |
          bash build_on_workstation.sh "$RUNNER_TEMP/expositor-build"
      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: TheExpositor-snplg
          path: ${{ runner.temp }}/expositor-build/TheExpositor/build/outputs/*.snplg
          if-no-files-found: error
          retention-days: 30
